<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <meta name="author" content="Tao Lin">

    <title>{{ site.title }} | {{ page.title }}</title>

    <!-- Bootstrap Core CSS -->
    <link href="{{ '/vendor/bootstrap/css/bootstrap.min.css' | relative_url }}" rel="stylesheet">

    <!-- Custom Fonts -->
    <link href="{{ '/vendor/font-awesome/css/font-awesome.min.css' | relative_url }}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css">
    <link href='https://fonts.googleapis.com/css?family=Kaushan+Script' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Droid+Serif:400,700,400italic,700italic' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700' rel='stylesheet' type='text/css'>

    <!-- Theme CSS -->
    <link href="{{ '/css/agency.min.css' | relative_url }}" rel="stylesheet">

    {%- feed_meta -%}
    {%- seo -%}
</head>

<body id="page-top" class="index">
    {% include header.html %}
    {{ content }}
    {% include footer.html %}

    <!-- jQuery -->
    <script src="{{ '/vendor/jquery/jquery.min.js' | relative_url }}"></script>

    <!-- Bootstrap Core JavaScript -->
    <script src="{{ '/vendor/bootstrap/js/bootstrap.min.js' | relative_url }}"></script>

    <!-- Plugin JavaScript -->
    <script src="http://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.3/jquery.easing.min.js"></script>

    <!-- Contact Form JavaScript -->
    <script src="{{ '/js/jqBootstrapValidation.js' | relative_url }}"></script>
    <script src="{{ '/js/contact_me.js' | relative_url }}"></script>

    <!-- Theme JavaScript -->
    <script src="{{ '/js/agency.min.js' | relative_url }}"></script>

    <!-- Google Universal Analytics -->
    <script>
    (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
    (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
    m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
    })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');

    ga('create', 'UA-80873012-1', 'auto');
    ga('send', 'pageview');
    </script>
</body>

</html>
